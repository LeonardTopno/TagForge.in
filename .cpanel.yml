---
deployment:
  tasks:
    # cPanel runs these with the Git repo as cwd. Use one shell so paths stay consistent.
    - |
      DEST=/home4/tagforge/public_html
      set -e
      /bin/mkdir -p "$DEST/assets/img" "$DEST/assets/css" "$DEST/assets/js" "$DEST/includes" "$DEST/scripts"
      # Fail early if critical source files are missing from the repo checkout.
      for f in api.php includes/init.php includes/helpers.php includes/platform.php includes/auth_guards.php includes/ops_api.php includes/admin_api.php; do
        /usr/bin/test -f "$f" || { echo "MISSING SOURCE: $f" >&2; exit 1; }
      done
      /bin/cp -RF assets/. "$DEST/assets/"
      /bin/cp -RF includes/. "$DEST/includes/"
      /bin/cp -RF scripts/. "$DEST/scripts/"
      # Explicit copies so a stale includes/ tree cannot hide new auth files.
      /bin/cp -f includes/init.php "$DEST/includes/init.php"
      /bin/cp -f includes/helpers.php "$DEST/includes/helpers.php"
      /bin/cp -f includes/platform.php "$DEST/includes/platform.php"
      /bin/cp -f includes/auth_guards.php "$DEST/includes/auth_guards.php"
      /bin/cp -f includes/ops_api.php "$DEST/includes/ops_api.php"
      /bin/cp -f includes/admin_api.php "$DEST/includes/admin_api.php"
      /bin/cp -f includes/schema.php "$DEST/includes/schema.php"
      /bin/cp -f includes/hosts.php "$DEST/includes/hosts.php"
      /bin/cp -f includes/db.php "$DEST/includes/db.php"
      /bin/cp -f includes/mail.php "$DEST/includes/mail.php"
      /bin/cp -f includes/razorpay.php "$DEST/includes/razorpay.php"
      /bin/cp -f .htaccess "$DEST/.htaccess"
      /bin/cp -f admin.php "$DEST/admin.php"
      /bin/cp -f api.php "$DEST/api.php"
      /bin/cp -f app.php "$DEST/app.php"
      /bin/cp -f index.php "$DEST/index.php"
      /bin/cp -f assets/img/favicon.ico "$DEST/favicon.ico"
      /bin/cp -f assets/img/favicon.png "$DEST/favicon.png"
      # Bust OPcache-ish file stats on shared hosts.
      /bin/touch "$DEST/api.php" "$DEST/includes/helpers.php" "$DEST/includes/platform.php" "$DEST/includes/auth_guards.php" "$DEST/includes/init.php"
      /usr/bin/test -f "$DEST/api.php"
      /bin/grep -q "2026-08-26-auth-guards" "$DEST/api.php"
      /usr/bin/test -f "$DEST/includes/platform.php"
      /usr/bin/test -f "$DEST/includes/auth_guards.php"
      /usr/bin/test -f "$DEST/includes/ops_api.php"
      /bin/grep -q "function assert_shop_not_suspended" "$DEST/includes/helpers.php"
      /bin/grep -q "function assert_shop_not_suspended" "$DEST/includes/auth_guards.php"
      echo "TagForge deploy OK: auth-guards"
