---
deployment:
  tasks:
    - export DEPLOYPATH=/home4/tagforge/public_html/
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R includes $DEPLOYPATH
    - /bin/cp -R scripts $DEPLOYPATH
    - /bin/cp .htaccess $DEPLOYPATH
    - /bin/cp admin.php $DEPLOYPATH
    - /bin/cp api.php $DEPLOYPATH
    - /bin/cp app.php $DEPLOYPATH
    - /bin/cp index.php $DEPLOYPATH
    - /bin/cp install.php $DEPLOYPATH
